<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="50%" stop-color="#6B1212"/>
      <stop offset="100%" stop-color="#4A0A0A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Ornate Circular Border Elements (Gigi Balang / Ray Pattern) -->
  <g stroke="url(#goldGrad)" stroke-width="3" opacity="0.6">
    <line x1="200" y1="35" x2="200" y2="48"/>
    <line x1="200" y1="352" x2="200" y2="365"/>
    <line x1="35" y1="200" x2="48" y2="200"/>
    <line x1="352" y1="200" x2="365" y2="200"/>
    <line x1="83" y1="83" x2="93" y2="93"/>
    <line x1="307" y1="83" x2="297" y2="93"/>
    <line x1="83" y1="317" x2="93" y2="307"/>
    <line x1="307" y1="317" x2="297" y2="307"/>
  </g>

  <!-- Traditional Sunray Corona (Sinar) -->
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(45 200 200)" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(90 200 200)" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(135 200 200)" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(180 200 200)" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(225 200 200)" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(270 200 200)" fill="url(#goldGrad)"/>
  <path d="M200,90 Q215,130 200,145 Q185,130 200,90 Z" transform="rotate(315 200 200)" fill="url(#goldGrad)"/>

  <!-- Center Crest Circle -->
  <circle cx="200" cy="200" r="95" fill="#580D0D" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Stylized SN Monogram / Cultural Icon -->
  <g fill="url(#goldGrad)" text-anchor="middle">
    <!-- Star Emblem on Top of Inner Badge -->
    <polygon points="200,130 204,142 216,142 206,150 210,162 200,154 190,162 194,150 184,142 196,142"/>
    
    <!-- Central Monogram -->
    <text x="200" y="215" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="2">SN</text>
  </g>

  <!-- Text Banners -->
  <!-- Arc Text: SINAR NORRAY -->
  <path id="textArcTop" d="M 75,200 A 125,125 0 0,1 325,200" fill="none"/>
  <text fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" letter-spacing="4" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">SINAR NORRAY</textPath>
  </text>

  <!-- Subtitle Text: SANGGAR SENI BETAWI -->
  <text x="200" y="245" fill="url(#goldGrad)" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">
    SENI &amp; BUDAYA BETAWI
  </text>

  <!-- Established 1995 -->
  <text x="200" y="268" fill="#FBD38D" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" letter-spacing="2" text-anchor="middle">
    EST. 1995 • HJ. NORI
  </text>
</svg>
